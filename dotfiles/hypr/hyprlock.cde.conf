# CDE Crimson lock. Backdrop is color set 3. The field is a sunken color-set-4 well.

general {
    disable_loading_bar = true
    grace = 300
    hide_cursor = true
    no_fade_in = true
    immediate_render = true
}

background {
    monitor =
    color = rgb(113, 139, 165)
    blur_passes = 0
}

input-field {
    monitor =
    size = 280, 40
    outline_thickness = 3
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    rounding = 0
    outer_color = rgb(70, 86, 99)
    inner_color = rgb(255, 247, 233)
    font_color = rgb(0, 0, 0)
    check_color = rgb(113, 139, 165)
    fail_color = rgb(178, 77, 122)
    fade_on_empty = false
    font_family = DejaVu Sans
    placeholder_text = Password
    hide_input = false
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = Hi there, $USER
    color = rgb(0, 0, 0)
    font_size = 22
    font_family = DejaVu Sans
    position = 0, 80
    halign = center
    valign = center
}

auth {
    fingerprint:enabled = true
}
