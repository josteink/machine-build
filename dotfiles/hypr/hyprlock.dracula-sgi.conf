# Dracula-SGI lock. Backdrop is Dracula #282a36, field is #44475a,
# purple label, green check, red failure.

general {
    disable_loading_bar = true
    grace = 300
    hide_cursor = true
    no_fade_in = true
    immediate_render = true
}

background {
    monitor =
    color = rgb(40, 42, 54)
    blur_passes = 0
}

input-field {
    monitor =
    size = 280, 40
    outline_thickness = 3
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    rounding = 0
    outer_color = rgb(98, 114, 164)
    inner_color = rgb(68, 71, 90)
    font_color = rgb(248, 248, 242)
    check_color = rgb(80, 250, 123)
    fail_color = rgb(255, 85, 85)
    fade_on_empty = false
    font_family = Nimbus Sans
    placeholder_text = Password
    hide_input = false
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = Hi there, $USER
    color = rgb(189, 147, 249)
    font_size = 22
    font_family = Nimbus Sans
    position = 0, 80
    halign = center
    valign = center
}

auth {
    fingerprint:enabled = true
}
